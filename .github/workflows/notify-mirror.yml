---
# The download mirror at neodev.team keeps a tarball copy of this repository
# (vep1400-linux-non_dsa-driver.tar.gz). neodevpro/no-pizza refreshes it from
# its own daily cron; this dispatch only makes the refresh immediate.
#
# Needs a fine-grained token in this repository as MIRROR_DISPATCH_TOKEN:
# repository neodevpro/no-pizza, permission "Contents: read and write".
# Without it the job is a no-op and the daily cron still syncs the mirror.
name: mirror sync

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask neodevpro/no-pizza to refresh the mirror copy
        env:
          TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MIRROR_DISPATCH_TOKEN is not set; skipping (the site cron still syncs)"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/neodevpro/no-pizza/dispatches \
            -d '{"event_type":"vep1400-updated"}'
