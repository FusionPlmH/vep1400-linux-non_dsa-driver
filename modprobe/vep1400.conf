# Dell VEP1400 / VMware SD-WAN Edge 610
#
# vep1400.ko must be probed before ixgbe: it programs the X553 backplane
# strap, and ixgbe reads that strap only once at probe time.  The softdep
# below makes modprobe (and therefore udev) load vep1400 first, so the
# uplinks come up at 1G without unloading anything.
softdep ixgbe pre: vep1400

# watchdog     : disarm the PIC watchdog (without it the box reboots every 4-5 min)
# sfp_tx       : clear TX_DISABLE on both SFP cages
# x553_speed   : X553 backplane strap, 1000 (default) or 2500; 0 keeps the NVM
# phy_speed    : 0 = front panel autonegotiation (default), 10/100/1000 = forced
# led_init     : program the front panel LED registers
# p2sb_bar_addr: only needed if the P2SB BAR cannot be autodetected
options vep1400 watchdog=1 sfp_tx=1 x553_speed=1000 phy_speed=0 led_init=1
